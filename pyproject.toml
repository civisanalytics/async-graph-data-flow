[build-system]
requires = ["setuptools >= 77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-graph-data-flow"
version = "2.0.0"
description = "Data flow along a directed acyclic graph of asynchronous generator functions"
readme = "README.md"
requires-python = ">= 3.10"
license = "BSD-3-Clause"
authors = [ { name = "Civis Analytics", email = "opensource@civisanalytics.com" } ]
keywords = [
    "async",
    "asynchronous",
    "asyncio",
    "data flow",
    "graph",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
]

[project.urls]
Documentation = "https://async-graph-data-flow.readthedocs.io"
Source = "https://github.com/civisanalytics/async-graph-data-flow"

[project.optional-dependencies]
dev = [
    # Running tests and linters
    "black",
    "flake8",
    "pytest",
    "mypy",

    # Managing source distributions
    "build",
    "twine",
]
docs = [
    "Sphinx",
    "furo",
    "numpydoc",
    "sphinx-copybutton",
    "sphinxcontrib-mermaid",
]

[tool.setuptools.packages.find]
where = [ "src" ]

[tool.setuptools]
zip-safe = false
package-dir = { "" = "src" }

[tool.pytest.ini_options]
addopts = "-vv --durations=0 --strict-markers"
testpaths = ["tests"]
